[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-streamer-face-clipper"
version = "1.0.0"
description = "Command-line FFmpeg tool for vertical streamer and GTA gameplay clips"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
gta-streamer-face-clipper = "streamer_generator.cli:main"

[tool.setuptools.packages.find]
include = ["streamer_generator*"]
